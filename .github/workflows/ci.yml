name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26.10.0", cache: npm }
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run typecheck
      - name: Migrations match the Drizzle schema (no drift)
        run: |
          npx drizzle-kit generate --name drift-check
          git status --porcelain apps/api/migrations | grep . && { echo "Schema changed without a committed migration"; exit 1; } || true
        working-directory: apps/api
      - run: npm test
      - run: node apps/api/dist/cli.js validate-content
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26.10.0", cache: npm }
      - run: npm ci && npm run build -w @threatready/contracts
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results }

  postgres:
    # The suite runs on embedded PGlite; this job proves the same migrations and RLS policies on a real PostgreSQL server.
    runs-on: ubuntu-24.04
    needs: verify
    services:
      postgres:
        image: postgres:17.6
        env: { POSTGRES_DB: threatready, POSTGRES_USER: threatready, POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U threatready" --health-interval 5s --health-retries 10
    env:
      THREATREADY_DATABASE_URL: postgres://threatready:ci-only@localhost:5432/threatready
      THREATREADY_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26.10.0", cache: npm }
      - run: npm ci && npm run build -w @threatready/contracts && npm run build -w @threatready/api
      - run: node apps/api/dist/cli.js migrate
      - run: node apps/api/dist/cli.js migrate   # idempotent

  image:
    runs-on: ubuntu-24.04-arm
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/arm64 -t threatready:ci .

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: "1.10.6" }
      - run: tofu fmt -check -recursive
        working-directory: infra/tofu
      - run: tofu init -backend=false && tofu validate
        working-directory: infra/tofu
